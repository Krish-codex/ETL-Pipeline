name: Scheduled Weather ETL Run

on:
  schedule:
    # Runs every day at 16:00 UTC (9:30 PM IST)
    - cron: '0 16 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab in the GitHub UI

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Setup SQLite and Run Loader (initializes tables)
      run: python main.py --step 3

    - name: Run live ETL pipeline (Extract, Clean, Load, Analyze)
      run: python main.py

    - name: Commit and push updated database & outputs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Stage data directories and reports
        git add data/ outputs/
        
        # Check if there are changes to commit
        if ! git diff-index --quiet HEAD; then
          git commit -m "Automated scheduled ETL run - $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          git push
        else
          echo "No new weather data changes detected. Skipping push."
        fi
